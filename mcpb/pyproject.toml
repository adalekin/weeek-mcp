# Environment for the Claude Desktop bundle (.mcpb). Desktop's built-in uv
# resolves it on first launch; the server itself comes from PyPI.
# The pin must match the release version (checked in release.yml).
[project]
name = "weeek-mcp-bundle"
version = "0.2.1"
requires-python = ">=3.10"
dependencies = ["weeek-mcp[kb]==0.2.1"]

[tool.uv]
package = false
