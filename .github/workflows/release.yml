name: Publish to PyPI

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"

env:
  PACKAGE_IMPORT: weeek_mcp

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.24"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi
          # The Desktop bundle installs this exact version from PyPI.
          MANIFEST=$(python3 -c "import json; print(json.load(open('mcpb/manifest.json'))['version'])")
          PIN=$(python3 -c "import tomllib; print(tomllib.load(open('mcpb/pyproject.toml', 'rb'))['project']['dependencies'][0])")
          if [ "$MANIFEST" != "$VERSION" ] || [ "$PIN" != "weeek-mcp[kb]==$VERSION" ]; then
            echo "mcpb/ is out of sync: manifest $MANIFEST, pin $PIN, package $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl python -c "import ${{ env.PACKAGE_IMPORT }}"

      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c "import ${{ env.PACKAGE_IMPORT }}"

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  bundle:
    name: Claude Desktop bundle
    # The bundle installs the release from PyPI, so it ships only once that exists.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack .mcpb
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb weeek-mcp.mcpb

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" weeek-mcp.mcpb --clobber
